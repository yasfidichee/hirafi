<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حريفي - أفضل الحرفيين بين يديك</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- ========== شاشة الترحيب ========== -->
  <section id="splashScreen" class="screen active">
    <div class="splash-content">
      <div class="logo-box">
        <h1 class="logo-text">حريفي</h1>
      </div>
      <p class="splash-sub">أفضل الحرفيين بين يديك</p>
    </div>
  </section>

  <!-- ========== اختيار الدور ========== -->
  <section id="roleScreen" class="screen">
    <div class="container">
      <h2 class="title">مرحبا بيك ف حريفي</h2>
      <p class="subtitle">واش نتا حريفي ولا كتقلب على شي حريفي؟</p>
      <div class="choice-list">
        <div class="choice-card orange" onclick="goToConsumer()">
          <div class="icon-circle"><span>🔍</span></div>
          <div class="choice-text">
            <h3>أنا مستهلك</h3>
            <p>كنقلب على حريفي</p>
          </div>
          <span class="arrow">‹</span>
        </div>
        <div class="choice-card teal" onclick="goToCraftsman()">
          <div class="icon-circle"><span>🔧</span></div>
          <div class="choice-text">
            <h3>أنا حريفي</h3>
            <p>بغيت نقدم خدماتي</p>
          </div>
          <span class="arrow">‹</span>
        </div>
      </div>
    </div>
  </section>

  <!-- ========== فورم المستهلك ========== -->
  <section id="consumerScreen" class="screen">
    <div class="container">
      <button class="back-btn" onclick="showScreen('roleScreen')">→ رجوع</button>
      <h2 class="title">معلومات المستهلك</h2>
      <p class="subtitle">عرفنا عليك شوية</p>
      <form id="consumerForm" onsubmit="submitConsumer(event)">
        <label>الاسم الكامل</label>
        <input type="text" id="consumerName" placeholder="مثال: أحمد بن علي" required>
        <label>العمر</label>
        <input type="number" id="consumerAge" placeholder="مثال: 25" min="16" required>
        <button type="submit" class="btn orange-btn">متابعة</button>
      </form>
    </div>
  </section>

  <!-- ========== فورم الحريفي ========== -->
  <section id="craftsmanScreen" class="screen">
    <div class="container">
      <button class="back-btn" onclick="showScreen('roleScreen')">→ رجوع</button>
      <h2 class="title">معلومات الحريفي</h2>

      <div class="avatar-picker" onclick="document.getElementById('photoInput').click()">
        <img id="avatarPreview" src="" alt="" style="display:none;">
        <span id="avatarPlaceholder">📷</span>
      </div>
      <p class="hint">اضغط باش تزيد صورة</p>
      <input type="file" id="photoInput" accept="image/*" style="display:none" onchange="previewPhoto(event)">

      <form id="craftsmanForm" onsubmit="submitCraftsman(event)">
        <label>الاسم الكامل</label>
        <input type="text" id="craftName" placeholder="مثال: محمد العلمي" required>
        <label>المهنة</label>
        <input type="text" id="craftProfession" placeholder="كهربائي، صباغ، نجار..." required>
        <label>المدينة</label>
        <input type="text" id="craftCity" placeholder="مثال: الدار البيضاء" required>
        <label>نبذة عليك (bio)</label>
        <textarea id="craftBio" rows="4" placeholder="عرف راسك بالحرفة ديالك..." required></textarea>
        <label>رقم الهاتف</label>
        <input type="tel" id="craftPhone" placeholder="06XXXXXXXX" required>
        <button type="submit" class="btn teal-btn">إنشاء الحساب</button>
      </form>
    </div>
  </section>

  <!-- ========== قائمة الحرفيين ========== -->
  <section id="listScreen" class="screen">
    <div class="top-bar">
      <h2>الحرفيين</h2>
      <button class="back-btn light" onclick="logout()">خروج</button>
    </div>
    <div class="filters">
      <input type="text" id="searchInput" placeholder="🔍 قلب على مدينة، اسم، مهنة..." oninput="renderCraftsmen()">
      <div class="chips" id="cityChips"></div>
      <div class="rating-filter">
        <span>⭐ التقييم الأدنى: <b id="ratingValue">0</b></span>
        <input type="range" id="ratingFilter" min="0" max="5" step="0.5" value="0" oninput="updateRatingFilter(this.value)">
      </div>
    </div>
    <div id="craftsmenList" class="craftsmen-list"></div>
  </section>

  <!-- ========== تفاصيل الحريفي ========== -->
  <section id="detailScreen" class="screen">
    <div class="top-bar teal-bar">
      <button class="back-btn light" onclick="showScreen('listScreen')">→ رجوع</button>
      <h2>بروفايل الحريفي</h2>
    </div>
    <div id="detailContent" class="container"></div>
  </section>

  <!-- ========== بروفايل الحريفي بعد التسجيل ========== -->
  <section id="myProfileScreen" class="screen">
    <div class="top-bar teal-bar">
      <h2>البروفايل ديالي</h2>
      <button class="back-btn light" onclick="logout()">خروج</button>
    </div>
    <div id="myProfileContent" class="container"></div>
  </section>

  <script src="app.js"></script>
</body>
</html>
